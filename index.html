<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Games</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="home.css">
</head>
<body>
  <div class="home">
    <header class="home-header">
      <h1>Games</h1>
      <p class="home-tagline">Pick a game and play</p>
      <div class="search-wrap">
        <input type="search" id="search" class="search-input" placeholder="Search games…" aria-label="Search games" autocomplete="off">
      </div>
    </header>

    <main class="game-list" id="game-list">
      <!-- Populated by JS from games data -->
    </main>

    <p class="no-results" id="no-results" hidden>No games match your search.</p>
  </div>

  <script src="home.js"></script>
</body>
</html>
